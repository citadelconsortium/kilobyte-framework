[project]
name = "kilobyte"
version = "1.13.5"
description = "Local-first terminal AI powered by one persistent GGUF brain"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["prompt_toolkit>=3.0", "Pygments>=2.15"]

[project.scripts]
kilo = "kilobyte.cli:main"
kilobyte-daemon = "kilobyte.daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
